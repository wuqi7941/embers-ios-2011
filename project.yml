name: YuanJin
options:
  bundleIdPrefix: net.de5
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

schemes:
  YuanJin:
    build:
      targets:
        YuanJin: all
    run:
      config: Release

targets:
  YuanJin:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.de5.guanjin2011
        PRODUCT_NAME: YuanJin
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        SWIFT_VERSION: "5.0"
