name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate signing key
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -alias embers \
            -storepass embers123 -keypass embers123 \
            -dname "CN=EMBERS, OU=Personal, O=Guanjin, L=Shanghai, ST=Shanghai, C=CN"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect
        working-directory: android
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/YuanJin.apk"
          ls -lh "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: YuanJin-apk
          path: out/YuanJin.apk
          retention-days: 30
